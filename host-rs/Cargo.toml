[package]
name = "sidechat-host"
version = "0.6.2"
edition = "2021"
description = "安能助手 Native Messaging Host（Rust）"
publish = false

[[bin]]
name = "sidechat-host"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
pdf-extract = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
