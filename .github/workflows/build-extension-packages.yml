name: Build extension packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Extension version
        required: true
        default: "0.7.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install extension dependencies
        working-directory: extension
        run: npm ci
      - name: Test extension
        working-directory: extension
        run: npm test
      - name: Inject runtime config
        env:
          RUNTIME_CONFIG_JSON: ${{ secrets.RUNTIME_CONFIG_JSON }}
        run: |
          if [ -n "${RUNTIME_CONFIG_JSON:-}" ]; then
            mkdir -p .secrets
            printf '%s' "$RUNTIME_CONFIG_JSON" > .secrets/runtime-config.json
          else
            echo "RUNTIME_CONFIG_JSON is not set; the unpacked package will require API settings."
          fi
      - name: Build extension packages
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          export APP_VERSION="${REQUESTED_VERSION#v}"
          ./packaging/build-unpacked-extension.sh
          ./packaging/build-extension-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: anneng-assistant-extension
          path: |
            dist/*-unpacked.zip
            dist/*-Chrome-Web-Store.zip
